name: Checks

# Type-check and unit tests on every pull request and on pushes to main.
# The content bots commit to main all day, so their paths are ignored here.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'content/**'
      - 'data/**'
      - 'scripts/seen-european.json'
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test
