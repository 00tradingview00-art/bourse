name: Update European Screener

on:
  schedule:
    # 18:30 UTC weekdays — after London and Frankfurt close
    - cron: '30 18 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run regardless of schedule'
        type: boolean
        default: false

jobs:
  update-screener:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch market data and compute indicators
        run: node scripts/update-screener.mjs

      - name: Commit screener data
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/screener.json data/stocks/
          if git diff --cached --quiet; then
            echo "No changes to screener data"
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            DATE=$(date -u +"%Y-%m-%d")
            git commit -m "data: screener update ${DATE}"
            git push
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Alert on failure
        if: failure()
        run: |
          curl -s -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: ${{ secrets.BREVO_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "sender": {"name":"Boursee CI","email":"alerts@boursee.com"},
              "to": [{"email":"00tradingview00@gmail.com"}],
              "subject": "Screener update failed — ${{ github.run_id }}",
              "htmlContent": "<p>The European Screener update job failed.</p><p><a href=\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\">View run →</a></p>"
            }' || true
