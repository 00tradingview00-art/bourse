name: Flash Intelligence

on:
  schedule:
    # EU market hours: 8:00 AM – 5:30 PM CET = 7:00 AM – 4:30 PM UTC, Mon–Fri
    # Every 30 min, offset 15 min from daily-brief.yml to avoid git conflicts.
    - cron: '15,45 7-16 * * 1-5'   # 8:15 AM – 5:45 PM CET
    - cron: '15 17 * * 1-5'        # 6:15 PM CET final window
  workflow_dispatch:

concurrency:
  group: flash-intelligence
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  flash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Monitor European events
        continue-on-error: true
        run: node scripts/monitor-european-events.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and push
        run: |
          git config user.name "Boursee Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/flash/ scripts/seen-european.json
          if git diff --staged --quiet; then
            echo "Nothing new to commit"
            exit 0
          fi
          FLASH=$(git diff --staged --name-only -- content/flash/ | grep -c '\.mdx$' || true)
          git stash
          git pull --rebase origin main
          git stash pop || true
          git add content/flash/ scripts/seen-european.json
          git diff --staged --quiet && echo "Nothing after rebase" && exit 0
          git commit -m "flash: ${FLASH} new article(s) $(date -u '+%H:%M UTC')"
          for attempt in 1 2 3; do
            git push origin main && break
            if [ $attempt -lt 3 ]; then
              echo "Push attempt $attempt rejected — rebasing..."
              git pull --rebase origin main || { git rebase --abort; exit 1; }
              sleep $((attempt * 3))
            fi
          done

      - name: Alert on failure
        if: failure()
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          REPO: ${{ github.repository }}
        run: |
          TIME=$(date -u '+%d %b %Y, %H:%M UTC')
          LINK="https://github.com/${REPO}/actions/workflows/flash-intelligence.yml"
          curl -s -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: ${BREVO_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"sender\":{\"name\":\"Boursee Bot\",\"email\":\"00tradingview00@gmail.com\"},\"to\":[{\"email\":\"00tradingview00@gmail.com\"}],\"subject\":\"Flash Intelligence failed — ${TIME}\",\"htmlContent\":\"<p>Flash Intelligence workflow failed on ${TIME}.</p><p><a href='${LINK}'>View workflow</a></p>\"}" \
            || true
