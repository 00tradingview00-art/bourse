<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark green rounded square -->
  <rect width="32" height="32" rx="7" fill="#1a4a2e"/>
  <!-- Subtle baseline -->
  <line x1="4" y1="26" x2="28" y2="26" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/>
  <!-- Rising market line: general uptrend with one dip (realistic) -->
  <polyline
    points="5,24 9,19 13,22 19,12 27,8"
    stroke="white"
    stroke-width="2.2"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Live indicator dot at peak: green ring + white center -->
  <circle cx="27" cy="8" r="3" fill="#4ade80"/>
  <circle cx="27" cy="8" r="1.4" fill="white"/>
</svg>
