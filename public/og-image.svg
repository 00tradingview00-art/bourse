<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">

  <!-- Background: very dark green -->
  <rect width="1200" height="630" fill="#0a1f12"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="420" x2="1200" y2="420" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="0" y1="300" x2="1200" y2="300" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="0" y1="180" x2="1200" y2="180" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Large decorative chart line (background, right side) -->
  <polyline
    points="600,480 700,390 780,430 880,310 980,260 1100,190 1200,160"
    stroke="rgba(74,222,128,0.12)"
    stroke-width="3"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- ── Icon mark (large, centre-left) ───────────────────────── -->
  <rect x="120" y="200" width="120" height="120" rx="20" fill="#1a4a2e"/>
  <line x1="136" y1="300" x2="224" y2="300" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <polyline
    points="138,295 158,272 174,280 196,250 218,232"
    stroke="white"
    stroke-width="6"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="218" cy="232" r="9" fill="#4ade80"/>
  <circle cx="218" cy="232" r="4.5" fill="white"/>

  <!-- ── Wordmark ────────────────────────────────────────────── -->
  <text
    x="268"
    y="295"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="72"
    font-weight="700"
    fill="white"
    letter-spacing="-2"
  >Boursee<tspan fill="#4ade80">.</tspan></text>

  <!-- ── Tagline ─────────────────────────────────────────────── -->
  <text
    x="120"
    y="370"
    font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-size="24"
    font-weight="400"
    fill="rgba(255,255,255,0.5)"
    letter-spacing="0.5"
  >European Market Intelligence · In Plain English</text>

  <!-- ── Exchange coverage strip ────────────────────────────── -->
  <text
    x="120"
    y="450"
    font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-size="16"
    font-weight="500"
    fill="rgba(255,255,255,0.25)"
    letter-spacing="2"
  >AEX · DAX · CAC 40 · FTSE 100 · IBEX 35 · FTSE MIB · OMX</text>

  <!-- Bottom domain -->
  <text
    x="1080"
    y="590"
    font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"
    font-size="16"
    font-weight="400"
    fill="rgba(255,255,255,0.25)"
    text-anchor="end"
  >boursee.com</text>

</svg>
